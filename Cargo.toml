[workspace]
members = ["programs/*"]
resolver = "2"

# overflow-checks = true => release/SBF derlemesinde tum aritmetik tasma kontrolu acik.
# (Denetim bulgusu O-4: onceden hicbir profilde acik degildi.)
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
incremental = false

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
